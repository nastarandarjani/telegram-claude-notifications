# Tracks whether the "claude" tmux session has an attached client, via a
# marker file (~/.claude_watching) -- used by the Telegram "Claude finished
# responding" Stop hook in ~/.claude/settings.json to suppress notifications
# while actively watching in that session. $HOME is shared storage across
# this cluster's login nodes, so the marker is visible regardless of which
# node the hook happens to run on (a plain who/tmux/SSH-env check is not,
# since those are node-local and this cluster load-balances SSH connections
# across multiple login nodes).
set-hook -g client-attached 'run-shell "[ \"#{session_name}\" = claude ] && touch ~/.claude_watching || true"'
set-hook -g client-detached 'run-shell "[ \"#{session_name}\" = claude ] && { tmux list-clients -t claude 2>/dev/null | grep -q . || rm -f ~/.claude_watching; } || true"'
# client-attached does NOT fire when a client creates-and-attaches to a
# brand-new session in one step (e.g. `tmux new -A -s claude ...` when
# "claude" doesn't exist yet) -- only on attaching to an ALREADY-existing
# session. session-created covers that first-connection case; confirmed via
# a throwaway test session that #{hook_session_name} is the correct format
# variable in this hook's context (client-attached/detached use
# #{session_name} instead).
set-hook -g session-created 'run-shell "[ \"#{hook_session_name}\" = claude ] && touch ~/.claude_watching || true"'
